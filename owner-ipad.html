<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#0f766e">
    <meta name="robots" content="noindex,nofollow">
    <title>DPRO 福祉施設送迎｜iPad配車画面</title>
    <link rel="stylesheet" href="shuttle.css">
    <script src="config.js" defer></script>
    <script src="preview-bootstrap.js" defer></script>
    <script src="shuttle.js" defer></script>
  </head>
  <body data-layout="ipad">
    <noscript>
      <div class="noscript-message">
        この画面を利用するにはJavaScriptを有効にしてください。
      </div>
    </noscript>
    <div id="app" class="app-loading" aria-busy="true">
      <div class="startup-card" role="status">
        <span class="spinner" aria-hidden="true"></span>
        <span>iPad配車画面を準備しています</span>
      </div>
    </div>
    <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
    <div id="modal-root"></div>
  </body>
</html>
