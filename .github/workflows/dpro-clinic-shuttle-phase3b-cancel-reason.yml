name: DPRO Clinic Shuttle Phase 3B Cancel Reason Fix

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/dpro-clinic-shuttle-phase3b-cancel-reason.yml"
      - ".github/workflows/dpro-clinic-shuttle-phase3b-cancel-reason.py"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply cancellation reason fix
        run: python .github/workflows/dpro-clinic-shuttle-phase3b-cancel-reason.py

      - name: JavaScript syntax check
        run: |
          node --check worker.js
          node --check shuttle.js
          node --check member.js
          node --check config.js

      - name: Diff check
        run: |
          git diff --check
          git status --short

      - name: Commit fix
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "DPRO Factory Bot"
          git config user.email "actions@users.noreply.github.com"
          git add worker.js shuttle.js member.js config.js CLINIC_SHUTTLE_BUILD_SPEC_V2_1.json PHASE3B_CANCEL_REASON_FIX_STATUS.txt reference/migrations/20260920_clinic_shuttle_reservation_cancel_reason_r1.sql
          git commit -m "Preserve reservation cancellation reasons"
          git push
