name: CLINIC_SHUTTLE V2.1 Phone Normalization

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/clinic-shuttle-v21-phone-normalization.yml'
      - '.github/workflows/clinic-shuttle-v21-phone-normalization-patch.py'

permissions:
  contents: write

jobs:
  phone-normalization:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python .github/workflows/clinic-shuttle-v21-phone-normalization-patch.py

      - name: Verify
        shell: bash
        run: |
          set -euo pipefail
          node --check worker.js
          grep -q 'const normalizedPhone = normalizeJapanesePhone(phone);' worker.js
          grep -q 'return normalizedPhone;' worker.js
          git diff --check

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "DPRO FACTORY"
          git config user.email "actions@users.noreply.github.com"
          git add worker.js
          git commit -m "Normalize stored Japanese phone numbers"
          git push
