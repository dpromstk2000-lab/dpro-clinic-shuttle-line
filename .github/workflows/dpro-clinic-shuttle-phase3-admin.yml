name: DPRO Clinic Shuttle Phase 3 Admin

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/dpro-clinic-shuttle-phase3-admin.yml"
      - ".github/workflows/dpro-clinic-shuttle-phase3-admin.py"

permissions:
  contents: write

jobs:
  phase3:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Phase 3 admin surfaces
        run: python .github/workflows/dpro-clinic-shuttle-phase3-admin.py

      - name: JavaScript syntax check
        run: |
          node --check worker.js
          node --check shuttle.js
          node --check config.js

      - name: Diff check
        run: |
          git diff --check
          git status --short

      - name: Commit Phase 3
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "DPRO Factory Bot"
          git config user.email "actions@users.noreply.github.com"
          git add worker.js shuttle.js shuttle.css config.js CLINIC_SHUTTLE_BUILD_SPEC_V2_1.json PHASE3_STATUS.txt
          git commit -m "Implement clinic shuttle phase 3 admin surfaces"
          git push
