name: CLINIC_SHUTTLE V2.1 Change Approval Core Fix

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/clinic-shuttle-v21-change-approval-core-fix.yml'
      - '.github/workflows/clinic-shuttle-v21-change-approval-core-patch.py'

permissions:
  contents: write

jobs:
  change-approval-core-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python .github/workflows/clinic-shuttle-v21-change-approval-core-patch.py

      - name: Verify
        shell: bash
        run: |
          set -euo pipefail
          node --check worker.js
          node --check shuttle.js
          node --check member.js
          grep -q 'excludeRiderId = null' worker.js
          grep -q '対象便' shuttle.js
          grep -q '迎えのみ' shuttle.js
          grep -q 'stop.stopStatus !== "cancelled"' member.js
          ! grep -A45 'async function handleStaffUpdate' worker.js | grep -q 'findRiderById'
          git diff --check

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "DPRO FACTORY"
          git config user.email "actions@users.noreply.github.com"
          git add worker.js shuttle.js member.js
          git commit -m "Fix change approval UX and rider/staff update guards"
          git push
