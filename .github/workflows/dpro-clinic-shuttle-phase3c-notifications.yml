name: DPRO Clinic Shuttle Phase 3C Notifications

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/dpro-clinic-shuttle-phase3c-notifications.yml"
      - ".github/workflows/dpro-clinic-shuttle-phase3c-notifications.py"

permissions:
  contents: write

jobs:
  phase3c:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply notification delivery integration
        run: python .github/workflows/dpro-clinic-shuttle-phase3c-notifications.py

      - name: JavaScript syntax check
        run: |
          node --check worker.js
          node --check config.js

      - name: Config parse check
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          raw = Path("wrangler.jsonc").read_text(encoding="utf-8")
          cleaned = "\n".join(
              line for line in raw.splitlines()
              if not line.lstrip().startswith("//")
          )
          json.loads(cleaned)
          PY

      - name: Diff check
        run: |
          git diff --check
          git status --short

      - name: Commit Phase 3-C
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "DPRO Factory Bot"
          git config user.email "actions@users.noreply.github.com"
          git add worker.js wrangler.jsonc system-check.html config.js CLINIC_SHUTTLE_BUILD_SPEC_V2_1.json PHASE3C_NOTIFICATION_STATUS.txt
          git commit -m "Integrate clinic shuttle notifications"
          git push
