name: CLINIC_SHUTTLE V2.1 Run Vehicle Assignment

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/clinic-shuttle-v21-run-vehicle-assignment.yml'
      - '.github/workflows/clinic-shuttle-v21-run-vehicle-assignment-patch.py'

permissions:
  contents: write

jobs:
  run-vehicle-assignment:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python .github/workflows/clinic-shuttle-v21-run-vehicle-assignment-patch.py

      - name: Verify
        shell: bash
        run: |
          set -euo pipefail
          node --check shuttle.js
          grep -q 'data-run-vehicle-select' shuttle.js
          grep -q 'data-assign-run-vehicle' shuttle.js
          grep -q 'function assignRunVehicle' shuttle.js
          grep -q 'vehicleId: vehicleId || null' shuttle.js
          grep -q 'run-vehicle-assignment' shuttle.css
          git diff --check

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "DPRO FACTORY"
          git config user.email "actions@users.noreply.github.com"
          git add shuttle.js shuttle.css
          git commit -m "Add run vehicle assignment controls"
          git push
