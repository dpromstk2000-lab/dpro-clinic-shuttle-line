name: CLINIC_SHUTTLE V2.1 Staff Date Picker

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/clinic-shuttle-v21-staff-date-picker.yml'
      - '.github/workflows/clinic-shuttle-v21-staff-date-picker-patch.py'

permissions:
  contents: write

jobs:
  staff-date-picker:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python .github/workflows/clinic-shuttle-v21-staff-date-picker-patch.py

      - name: Verify
        shell: bash
        run: |
          set -euo pipefail
          node --check staff.js
          grep -q 'id="staff-service-date"' staff.js
          grep -q 'url.searchParams.set("serviceDate", value)' staff.js
          grep -q '.staff-date-control input' staff.css
          git diff --check

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "DPRO FACTORY"
          git config user.email "actions@users.noreply.github.com"
          git add staff.js staff.css
          git commit -m "Add date picker to staff operations"
          git push
