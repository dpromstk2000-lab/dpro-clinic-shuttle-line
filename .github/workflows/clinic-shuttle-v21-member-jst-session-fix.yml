name: CLINIC_SHUTTLE V2.1 Member JST Session Fix

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/clinic-shuttle-v21-member-jst-session-fix.yml'
      - '.github/workflows/clinic-shuttle-v21-member-jst-session-patch.py'

permissions:
  contents: write

jobs:
  member-jst-session-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply family UI patch
        run: python .github/workflows/clinic-shuttle-v21-member-jst-session-patch.py

      - name: Verify
        shell: bash
        run: |
          set -euo pipefail
          node --check member.js
          grep -q 'timeZone: "Asia/Tokyo"' member.js
          grep -q 'refreshMemberSessionIfNeeded' member.js
          grep -q '/v1/auth/refresh' member.js
          git diff --check

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "DPRO FACTORY"
          git config user.email "actions@users.noreply.github.com"
          git add member.js
          git commit -m "Fix family JST time and active session refresh"
          git push
