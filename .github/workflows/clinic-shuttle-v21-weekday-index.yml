name: CLINIC_SHUTTLE V2.1 Weekday Index

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/clinic-shuttle-v21-weekday-index.yml'
      - '.github/workflows/clinic-shuttle-v21-weekday-index-patch.py'

permissions:
  contents: write

jobs:
  weekday-index:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python .github/workflows/clinic-shuttle-v21-weekday-index-patch.py

      - name: Verify
        shell: bash
        run: |
          set -euo pipefail
          node --check shuttle.js
          grep -q 'weekday-index' shuttle.js
          grep -q 'jump-schedule-day' shuttle.js
          grep -q 'function jumpToScheduleDay' shuttle.js
          grep -q 'weekday-index' shuttle.css
          git diff --check

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "DPRO FACTORY"
          git config user.email "actions@users.noreply.github.com"
          git add shuttle.js shuttle.css
          git commit -m "Add weekday index to regular schedules"
          git push
