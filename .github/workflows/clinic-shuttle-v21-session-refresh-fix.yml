name: CLINIC_SHUTTLE V2.1 Session Refresh Fix

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/clinic-shuttle-v21-session-refresh-fix.yml'
      - '.github/workflows/clinic-shuttle-v21-session-refresh-patch.py'

permissions:
  contents: write

jobs:
  session-refresh-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply session refresh patch
        run: python .github/workflows/clinic-shuttle-v21-session-refresh-patch.py

      - name: Verify
        shell: bash
        run: |
          set -euo pipefail
          node --check worker.js
          node --check shuttle.js
          node --check staff.js
          grep -q 'POST /v1/auth/refresh' worker.js
          grep -q 'handleRefreshSession' worker.js
          grep -q 'refreshSessionIfNeeded' shuttle.js
          grep -q 'refreshSessionIfNeeded' staff.js
          grep -q '"SESSION_TTL_SECONDS": "1800"' wrangler.jsonc
          git diff --check

      - name: Commit patched runtime files
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No runtime changes to commit."
            exit 0
          fi
          git config user.name "DPRO FACTORY"
          git config user.email "actions@users.noreply.github.com"
          git add worker.js shuttle.js staff.js wrangler.jsonc
          git commit -m "Add active session refresh for CLINIC_SHUTTLE"
          git push
