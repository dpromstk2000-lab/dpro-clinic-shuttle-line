name: DPRO Clinic Shuttle Phase 3C Notification Message Fix

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/dpro-clinic-shuttle-phase3c-message-fix.yml"
      - ".github/workflows/dpro-clinic-shuttle-phase3c-message-fix.py"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply notification message fix
        run: python .github/workflows/dpro-clinic-shuttle-phase3c-message-fix.py

      - name: JavaScript syntax check
        run: |
          node --check worker.js
          node --check staff.js
          node --check config.js

      - name: Diff check
        run: |
          git diff --check
          git status --short

      - name: Commit fix
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "DPRO Factory Bot"
          git config user.email "actions@users.noreply.github.com"
          git add worker.js staff.js config.js system-check.html CLINIC_SHUTTLE_BUILD_SPEC_V2_1.json PHASE3C_NOTIFICATION_MESSAGE_FIX_STATUS.txt
          git commit -m "Fix clinic shuttle notification message formatting"
          git push
