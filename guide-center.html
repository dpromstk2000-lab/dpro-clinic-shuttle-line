<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#0f766e">
  <meta name="robots" content="noindex,nofollow">
  <title>DPRO 福祉施設送迎｜ガイドセンター</title>
  <style>
    :root{--brand:#0f766e;--deep:#0b625c;--navy:#0b2f4f;--ink:#183247;--muted:#607482;--line:#d2e0e3;--soft:#eaf7f5;--bg:#f3f8f7;--surface:#fff;--shadow:0 10px 32px rgb(11 47 79 / 10%);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;color:var(--ink);background:var(--bg)}*{box-sizing:border-box}html,body{min-width:320px;margin:0;overflow-x:hidden;background:var(--bg)}body{min-height:100vh;line-height:1.65}.shell{width:min(100% - 28px,1040px);margin:auto;padding:24px 0 48px}.hero{padding:clamp(22px,5vw,42px);border-radius:24px;background:linear-gradient(135deg,var(--navy),var(--brand));color:white;box-shadow:var(--shadow)}.hero small{font-weight:900;letter-spacing:.1em}.hero h1{margin:7px 0 0;font-size:clamp(28px,6vw,46px);line-height:1.3}.hero p{max-width:760px;margin:10px 0 0;color:#dceeed;font-weight:650}.hero-actions,.role-filter{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}.button,.role-filter button{min-height:44px;display:inline-flex;align-items:center;justify-content:center;padding:9px 14px;border:1px solid #b9d1d2;border-radius:11px;background:white;color:var(--deep);font-weight:850;text-decoration:none;cursor:pointer}.button.primary{border-color:white;background:white;color:var(--deep)}.button.ghost{border-color:rgb(255 255 255 / 35%);background:rgb(255 255 255 / 8%);color:white}.role-filter{padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}.role-filter strong{width:100%;color:var(--navy)}.role-filter button[aria-pressed="true"]{border-color:var(--brand);background:var(--soft);box-shadow:inset 0 0 0 1px var(--brand)}.status{margin-top:16px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--muted);font-weight:700}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:18px}.card{min-width:0;padding:20px;border:1px solid var(--line);border-radius:18px;background:var(--surface);box-shadow:var(--shadow)}.card h2{margin:0;color:var(--navy);font-size:22px}.card ul{margin:12px 0 0;padding-left:1.3em}.card li{margin:7px 0;overflow-wrap:anywhere}.trace{margin-top:13px;color:var(--muted);font-size:12px;font-weight:750}.first10{margin-top:22px;padding:20px;border:1px solid #9bd4cf;border-radius:18px;background:var(--soft)}.first10 h2{margin:0;color:var(--navy)}.first10 p{margin:7px 0 0;color:var(--muted)}.first10 .button{margin-top:12px;border-color:var(--brand);background:var(--brand);color:white}.error{border-color:#e5a29e;background:#fff1f0;color:#8f302b}@media(max-width:720px){.grid{grid-template-columns:1fr}.shell{width:min(100% - 18px,1040px)}.hero-actions{display:grid}.button{width:100%}}button:focus-visible,a:focus-visible{outline:3px solid rgb(45 212 191 / 40%);outline-offset:3px}
  </style>
  <script src="guide-center.js" defer></script>
</head>
<body>
  <main class="shell">
    <section class="hero">
      <small>GUIDE CENTER / CONTENT_PACKAGE.json</small>
      <h1>DPRO 福祉施設送迎<br>ガイドセンター</h1>
      <p>家族・管理・iPad・スタッフの役割ごとに、見る場所と安全上の注意を確認できます。内容はR2で承認されたCONTENT_PACKAGE.jsonから表示します。</p>
      <div class="hero-actions"><a class="button primary" href="index.html?tutorial=replay">First10を最初から再生</a><a class="button ghost" href="index.html">操作デモ入口へ戻る</a></div>
    </section>
    <section class="role-filter" aria-label="役割で絞り込む">
      <strong>役割に合わせて表示</strong>
      <button type="button" data-guide-role="all" aria-pressed="true">すべて</button>
      <button type="button" data-guide-role="family">家族・保護者</button>
      <button type="button" data-guide-role="owner">管理・配車</button>
      <button type="button" data-guide-role="ipad">iPad</button>
      <button type="button" data-guide-role="staff">スタッフ</button>
    </section>
    <div id="guide-status" class="status" role="status">ガイド内容を読み込んでいます。</div>
    <section id="guide-grid" class="grid" aria-live="polite"></section>
    <section class="first10">
      <h2>First10をもう一度見る</h2>
      <p>操作ガイドは説明・安全な画面移動・ハイライトのみを行い、登録・送信・承認・状態変更などは自動実行しません。</p>
      <a class="button" href="index.html?tutorial=replay">First10を再生</a>
    </section>
  </main>
</body>
</html>
