name: STEP DPRO-SYSTEMS-4 Shuttle Operation Demo

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/step-dpro-systems-4-shuttle-operation-demo.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clarify shuttle operation demo
        shell: python
        run: |
          from pathlib import Path
          import base64
          import re

          html_path = Path("index.html")
          css_path = Path("portal.css")
          html = html_path.read_text(encoding="utf-8")
          css = css_path.read_text(encoding="utf-8")

          notice = base64.b64decode("").decode("utf-8")
          safety_list = base64.b64decode("").decode("utf-8")
          css_append = base64.b64decode("").decode("utf-8")

          def replace_once(text, old, new, label):
              if new in text:
                  return text
              if old not in text:
                  raise SystemExit("ERROR: " + label + " target not found")
              return text.replace(old, new, 1)

          html = replace_once(
              html,
              "<title>DPRO 福祉施設送迎｜利用開始ポータル</title>",
              "<title>DPRO 福祉施設送迎｜操作デモポータル</title>",
              "page title"
          )

          html = replace_once(
              html,
              "<body>",
              '<body class="operation-demo-page">',
              "body class"
          )

          html = replace_once(
              html,
              "<small>利用開始ポータル</small>",
              "<small>操作デモポータル</small>",
              "brand subtitle"
          )

          old_badge = '<span id="environment-badge" class="environment-badge">確認中</span>'
          new_badge = '<div class="header-actions"><span id="environment-badge" class="environment-badge">確認中</span><a class="official-return-link" href="https://dpro-shop.com/systems/shuttle">公式の機能説明を見る</a></div>'
          html = replace_once(html, old_badge, new_badge, "header action")

          if "これは実際の画面を試すための公開操作デモです" not in html:
              html = replace_once(
                  html,
                  "<main>",
                  "<main>\n" + notice,
                  "operation demo notice"
              )

          html = replace_once(
              html,
              '<p class="eyebrow">WELFARE SHUTTLE LINE SYSTEM</p>',
              '<p class="eyebrow">WELFARE SHUTTLE OPERATION DEMO</p>',
              "hero eyebrow"
          )

          html = replace_once(
              html,
              "<h1 id=\"page-title\">使う方に合わせて<br>画面を選んでください</h1>",
              "<h1 id=\"page-title\">家族・管理者・スタッフの<br>操作画面を体験</h1>",
              "hero title"
          )

          html = replace_once(
              html,
              "管理・配車、送迎スタッフ、ご家族、営業前検査を、ひとつの入口から迷わず開けます。",
              "ご家族の予定確認、管理・配車、運転員・添乗員の運行記録を、役割別の画面で体験できます。",
              "hero copy"
          )

          html = re.sub(
              r'\s*<span><strong>版</strong><span id="frontend-version">.*?</span></span>',
              "",
              html,
              count=1,
              flags=re.S
          )

          html = replace_once(
              html,
              "<li>デモデータ準備</li>",
              "<li>変更依頼の確認・承認</li>",
              "owner feature"
          )

          html, removed_check = re.subn(
              r'\s*<article class="role-card is-check">.*?</article>',
              "",
              html,
              count=1,
              flags=re.S
          )
          if removed_check == 0 and "システム一括検査" in html:
              raise SystemExit("ERROR: internal system check card was not removed")

          html = replace_once(
              html,
              "<h2 id=\"demo-title\">デモ用ログイン情報</h2>",
              "<h2 id=\"demo-title\">操作デモ用ログイン情報</h2>",
              "demo login heading"
          )

          html = replace_once(
              html,
              "<div><strong>デモデータを準備</strong><p>「システム確認」から一度だけ実行します。再実行しても重複しません。</p></div>",
              "<div><strong>ログイン情報を確認</strong><p>管理者・スタッフ・ご家族それぞれのデモ用番号と暗証番号を確認します。</p></div>",
              "demo flow step two"
          )

          html = replace_once(
              html,
              "<h2 id=\"safety-title\">安全な運用のために</h2>",
              "<h2 id=\"safety-title\">公開デモを安全に体験するために</h2>",
              "safety heading"
          )

          html, safety_count = re.subn(
              r'(<section class="section safety-section".*?<div class="safety-card">.*?</div>\s*)<ul>.*?</ul>',
              r'\1' + safety_list,
              html,
              count=1,
              flags=re.S
          )
          if safety_count == 0:
              raise SystemExit("ERROR: safety list target not found")

          html = replace_once(
              html,
              '<span id="footer-version">SHUTTLE-9-FRONTEND-20260729</span>',
              "<span>公開操作デモ</span>",
              "public footer"
          )

          marker = "/* DPRO-SYSTEMS-4 SHUTTLE OPERATION DEMO */"
          if marker not in css:
              css = css.rstrip() + "\n\n" + css_append.strip() + "\n"

          html_path.write_text(html, encoding="utf-8")
          css_path.write_text(css, encoding="utf-8")

          updated_html = html_path.read_text(encoding="utf-8")
          updated_css = css_path.read_text(encoding="utf-8")

          assert 'class="operation-demo-page"' in updated_html
          assert "操作デモポータル" in updated_html
          assert "これは実際の画面を試すための公開操作デモです" in updated_html
          assert "公式の機能説明を見る" in updated_html
          assert "営業前検査" not in updated_html
          assert "システム一括検査" not in updated_html
          assert "system-check.html" not in updated_html
          assert "デモデータを準備" not in updated_html
          assert "SHUTTLE-9-FRONTEND-20260729" not in updated_html
          assert "公開操作デモ" in updated_html
          assert marker in updated_css

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "dpro-systems-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html portal.css
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "STEP DPRO-SYSTEMS-4 clarify welfare shuttle operation demo"
          git push
